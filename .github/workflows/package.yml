name: Package

# Executables are built here on real runners, never in a development session:
# a macOS build produced anywhere but macOS is unsigned and Apple Silicon
# refuses to launch it, and a Windows NSIS installer needs Wine off-Windows.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            script: pack:mac
            artifact: mohasib-macos-arm64
          - name: Windows (x64)
            os: windows-latest
            script: pack:win
            artifact: mohasib-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # Unsigned builds. Set CSC_LINK / CSC_KEY_PASSWORD (macOS) or
          # WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (Windows) as repository secrets
          # to sign, and drop this line.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
